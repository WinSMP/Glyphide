# Glyphide configuration

# The chat format using placeholders and color codes
# Placeholders: $prefix, $username, $suffix, $world, $message
# Colors:
# - & codes (e.g., &a for green, &7 for gray)
# - MiniMessage: Use <#hexcolor>, <gradient>, etc. (requires specific permissions)

chat:
  format: "&8[$world] $prefix&r &7| &b$username&r &8➤ &7$message"
url:
    color: "#4430cc"
    hover: true
    description-max-length: 15

# Placeholders typed by players in chat, replaced with rich components.
# Each entry below a placeholder is independent; remove or add sections freely.
#   enabled: whether the tokens below are substituted at all (default: false)
#   token: the literal strings players type, replaced by whatever the placeholder shows
placeholder:
  item:
    enabled: false
    token: ["[item]", "[i]"]
  hotbar:
    enabled: false
    token: ["[hotbar]"]

use-hypixel-placeholders: true
use-emoji-shortcodes: false
