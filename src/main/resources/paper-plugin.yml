name: 'Glyphide'
version: '0.6.1'
main: 'org.winlogon.glyphide.GlyphideFormatter'
loader: 'org.winlogon.glyphide.GlyphideLoader'
description: 'A highly‑customizable chat‑formatting plugin for Paper Minecraft servers, powered by MiniMessage and placeholders for dynamic, colorful in‑game chat.'
folia-supported: true
api-version: 1.21
permissions:
  glyphide.admin:
    description: 'Use MiniMessage formatting in chat'
    default: op
  glyphide.admin.reload:
    description: 'Reload the configuration with /ghreload'
    default: op
dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: true
      join-classpath: true
